<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hero Option 2 — Minimalis Ekstrem</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .hero-top-meta { display: block; margin-bottom: 16px; }
        .hero-bento-badge { display: none !important; }
        .hero-title-massive { font-size: clamp(2.2rem, 7vw, 3.5rem); margin-bottom: 16px; }
        .hero-subtitle-clean { font-size: 1rem; opacity: 0.9; margin-bottom: 24px; }
    </style>
</head>
<body>
    <section class="hero-section" style="min-height: 100vh;">
        <video class="hero-bg-media" autoplay loop muted playsinline poster="hero_bg_poster.jpg">
            <source src="hero_bg_video.mp4" type="video/mp4">
        </video>
        <div class="hero-overlay" style="background: linear-gradient(to bottom, rgba(11,14,20,0.85), rgba(11,14,20,0.95));"></div>

        <div class="container" style="position: relative; z-index: 5;">
            <div class="hero-content">
                <div class="brand-motto-handwritten" style="font-size: 1.6rem; color: #FACC15; margin-bottom: 16px;">"Mapping today, Shaping Tomorrow."</div>
                <h1 class="hero-title-massive">Yakin siap kehilangan Rp 100 Juta hanya karena anak salah jurusan?</h1>
                <p class="hero-subtitle-clean">87% mahasiswa merasa salah jurusan. Amankan masa depan akademik anak Anda lewat pemetaan online 20 menit secara GRATIS sebelum terlanjur mendaftar.</p>
                <a href="https://wa.me/628123456789" class="btn-yellow-pill">Mulai Test Gratis →</a>
            </div>
        </div>
    </section>
</body>
</html>
