<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexum Hero</title>
  
  <!-- Load fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["'Geist'", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
            silkscreen: ["'Silkscreen'", "cursive"],
          }
        }
      }
    }
  </script>
  
  <!-- Custom global styles -->
  <style>
    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>

  <!-- Load React, ReactDOM, and Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-black text-white antialiased overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Inline SVG Icon components matching Lucide
    const ChevronDown = ({ className = "h-4 w-4" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="m6 9 6 6 6-6"/>
      </svg>
    );

    const Menu = ({ className = "h-6 w-6" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <line x1="4" x2="20" y1="12" y2="12"/>
        <line x1="4" x2="20" y1="6" y2="6"/>
        <line x1="4" x2="20" y1="18" y2="18"/>
      </svg>
    );

    const X = ({ className = "h-6 w-6" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M18 6 6 18"/>
        <path d="m6 6 12 12"/>
      </svg>
    );

    function App() {
      const [isOpen, setIsOpen] = useState(false);

      useEffect(() => {
        if (isOpen) {
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = '';
        }
        return () => {
          document.body.style.overflow = '';
        };
      }, [isOpen]);

      const links = [
        { name: 'Modules', href: '#modules' },
        { name: 'Clientele', href: '#clientele' },
        { name: 'Solutions', href: '#solutions', hasDropdown: true },
        { name: 'Billing', href: '#billing' }
      ];

      return (
        <section className="relative h-screen w-full overflow-hidden select-none bg-black">
          {/* Background Video */}
          <video 
            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260803_192301_9231ed6b-c55c-4a48-909c-4ebe11cf2e11.mp4"
            className="absolute inset-0 h-full w-full object-cover z-0"
            autoPlay
            loop
            muted
            playsInline
          />

          <div className="relative z-10 flex flex-col h-full">
            {/* Top Navigation */}
            <nav className="flex items-center justify-between w-full z-30 px-5 py-5 sm:px-8 sm:py-6 lg:px-12">
              {/* Logo */}
              <div className="flex items-center gap-2 text-[#010101] lg:text-white transition-colors duration-300">
                <svg width="24" height="24" viewBox="0 0 256 256" className="fill-current">
                  <path d="M 128 128 C 128 198.692 70.692 256 0 256 C 0 185.308 57.308 128 128 128 Z M 128 128 C 198.692 128 256 185.308 256 256 C 185.308 256 128 198.692 128 128 Z M 0 0 C 70.692 0 128 57.308 128 128 C 57.308 128 0 70.692 0 0 Z M 256 0 C 256 70.692 198.692 128 128 128 C 128 57.308 185.308 0 256 0 Z" />
                </svg>
                <span className="text-lg font-semibold lowercase">nexum</span>
              </div>

              {/* Desktop Nav */}
              <div className="hidden md:flex items-stretch gap-3">
                <div className="flex items-center gap-1 rounded-full bg-white/10 px-1.5 py-1.5 backdrop-blur-lg">
                  {links.map((link) => (
                    <a
                      key={link.name}
                      href={link.href}
                      className="flex items-center gap-1 rounded-full px-4 py-1.5 text-sm font-medium text-white/80 hover:bg-white/10 hover:text-white transition-colors duration-200"
                    >
                      {link.name}
                      {link.hasDropdown && <ChevronDown className="h-3.5 w-3.5" />}
                    </a>
                  ))}
                </div>
                <button 
                  className="self-stretch rounded-full px-5 text-sm font-medium text-white flex items-center justify-center hover:opacity-90 transition-opacity"
                  style={{ background: 'linear-gradient(to bottom, #2B2B2B, #101010)' }}
                >
                  Get started
                </button>
              </div>

              {/* Mobile Hamburger Button */}
              <button 
                onClick={() => setIsOpen(!isOpen)}
                className="relative h-10 w-10 rounded-full bg-white/10 backdrop-blur-lg z-50 flex items-center justify-center text-[#010101] lg:text-white transition-colors duration-300 focus:outline-none md:hidden"
              >
                <span className={`absolute transform transition-all duration-300 ${isOpen ? 'rotate-90 scale-0 opacity-0' : 'rotate-0 scale-100 opacity-100'}`}>
                  <Menu className="h-5 w-5" />
                </span>
                <span className={`absolute transform transition-all duration-300 ${isOpen ? 'rotate-0 scale-100 opacity-100' : '-rotate-90 scale-0 opacity-0'}`}>
                  <X className="h-5 w-5" />
                </span>
              </button>
            </nav>

            {/* Mobile Drawer Backdrop */}
            <div 
              className={`fixed inset-0 z-40 bg-black/80 backdrop-blur-md transition-opacity duration-300 ${isOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}
              onClick={() => setIsOpen(false)}
            />

            {/* Mobile Drawer Panel */}
            <div 
              className={`fixed right-0 top-0 z-40 h-full w-72 bg-black/90 backdrop-blur-xl transform transition-transform duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] flex flex-col ${isOpen ? 'translate-x-0' : 'translate-x-full'}`}
            >
              <nav className="flex flex-col gap-2 px-6 pt-24">
                {links.map((link, index) => {
                  const delay = (index + 1) * 60;
                  return (
                    <a
                      key={link.name}
                      href={link.href}
                      onClick={() => setIsOpen(false)}
                      className={`flex items-center justify-between rounded-xl px-4 py-3.5 text-base font-medium text-white/80 hover:bg-white/10 hover:text-white transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                        isOpen 
                          ? 'opacity-100 translate-x-0' 
                          : 'opacity-0 translate-x-6 pointer-events-none'
                      }`}
                      style={{ transitionDelay: `${delay}ms` }}
                    >
                      {link.name}
                      {link.hasDropdown && <ChevronDown className="h-4 w-4 text-white/60" />}
                    </a>
                  );
                })}
              </nav>

              <div 
                className={`mt-auto px-6 pb-10 transition-all duration-400 ease-out ${
                  isOpen 
                    ? 'opacity-100 translate-y-0' 
                    : 'opacity-0 translate-y-4 pointer-events-none'
                }`}
                style={{ transitionDelay: '300ms' }}
              >
                <button 
                  className="w-full rounded-full py-3.5 text-sm font-medium text-white flex items-center justify-center hover:opacity-90 transition-opacity" 
                  style={{ background: 'linear-gradient(to bottom, #2B2B2B, #101010)' }}
                >
                  Get started
                </button>
              </div>
            </div>

            {/* Main Content Block (bottom-anchored) */}
            <main className="mt-auto w-full px-5 pb-8 sm:px-8 sm:pb-12 lg:px-12 lg:pb-16 flex flex-col gap-6 sm:gap-8 lg:flex-row lg:items-end lg:justify-between z-20">
              {/* Left Side: Headline + Email CTA */}
              <div className="max-w-xl">
                <h1 className="text-3xl sm:text-4xl lg:text-[3.5rem] font-semibold leading-[1.1] tracking-tight text-[#010101] lg:text-white transition-colors duration-300">
                  Ship AI workers that grind while you rest
                </h1>

                {/* Email CTA */}
                <form onSubmit={(e) => e.preventDefault()} className="mt-6 sm:mt-8 w-full sm:w-auto">
                  <div className="flex flex-col gap-3 sm:inline-flex sm:flex-row sm:items-center sm:rounded-full sm:bg-white sm:p-1.5 sm:shadow-lg">
                    <input 
                      type="email" 
                      placeholder="Type your email" 
                      className="w-full rounded-full bg-white px-5 py-3 text-sm text-gray-900 placeholder-gray-400 outline-none sm:w-64 sm:rounded-none sm:bg-transparent sm:px-4 sm:py-2"
                      required
                    />
                    <button 
                      type="submit"
                      className="w-full sm:w-auto rounded-full px-6 py-3 sm:py-2.5 text-sm font-medium text-white flex items-center justify-center hover:opacity-90 transition-opacity" 
                      style={{ background: 'linear-gradient(to bottom, #2B2B2B, #101010)' }}
                    >
                      Get started
                    </button>
                  </div>
                </form>
              </div>

              {/* Right Side: Two Glass Cards */}
              <div className="flex flex-col gap-4 sm:flex-row w-full lg:w-auto lg:gap-5">
                {/* Stats Card */}
                <div className="flex flex-col justify-between rounded-2xl bg-white/10 backdrop-blur-lg p-5 sm:p-6 sm:w-64">
                  <span 
                    className="text-3xl sm:text-4xl font-normal tracking-tight text-[#010101] lg:text-white transition-colors duration-300 font-silkscreen"
                  >
                    42,500+
                  </span>
                  <p className="text-sm leading-relaxed mt-3 sm:mt-4 text-[#010101]/70 lg:text-white/70 transition-colors duration-300">
                    Teams run Nexum to handle recurring ops daily.
                  </p>
                </div>

                {/* Testimonial Card */}
                <div className="rounded-2xl bg-white/10 backdrop-blur-lg p-5 sm:p-6 sm:w-64">
                  {/* Header Row */}
                  <div className="flex items-center gap-2 mb-3 sm:mb-4">
                    <div className="w-6 h-6 rounded bg-[#010101] flex items-center justify-center text-white font-bold text-xs select-none">
                      S
                    </div>
                    <span className="text-sm font-semibold text-[#010101] lg:text-white transition-colors duration-300">
                      Stratify
                    </span>
                  </div>
                  {/* Quote */}
                  <p className="text-sm leading-relaxed text-[#010101]/80 lg:text-white/80 transition-colors duration-300">
                    "With Nexum we went from managing tedious operational work to having AI agents that handle everything."
                  </p>
                  {/* Footer */}
                  <div className="flex items-center gap-3 mt-4 sm:mt-5">
                    <img 
                      src="https://i.pravatar.cc/72?img=12" 
                      alt="Sara Klein" 
                      className="w-9 h-9 rounded-full object-cover bg-white/20"
                    />
                    <div>
                      <div className="text-sm font-semibold text-[#010101] lg:text-white transition-colors duration-300">
                        Sara Klein
                      </div>
                      <div className="text-xs text-[#010101]/60 lg:text-white/60 transition-colors duration-300">
                        Dir of Operations
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </main>
          </div>
        </section>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
